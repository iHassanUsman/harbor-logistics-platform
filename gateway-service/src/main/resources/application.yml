server:
  port: 8080

spring:
  application:
    name: gateway-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      httpclient:
        connect-timeout: 2000
        response-timeout: 8s
      default-filters:
        - name: Retry
          args:
            retries: 2
            methods: GET
            series: SERVER_ERROR
      routes:
        - id: customer
          uri: ${CUSTOMER_URI:http://localhost:8081}
          predicates:
            - Path=/api/customers/**
        - id: shipment
          uri: ${SHIPMENT_URI:http://localhost:8082}
          predicates:
            - Path=/api/shipments/**
        - id: finance
          uri: ${FINANCE_URI:http://localhost:8083}
          predicates:
            - Path=/api/finance/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,gateway
